services:
  - type: web
    name: attendly
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: attendly-db
          property: connectionString

databases:
  - name: attendly-db
    plan: free
    databaseName: attendly
    user: attendly
